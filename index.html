<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Picker - Waterloo / Cedar Falls</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
        }
        .source-note {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            font-style: italic;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .filter-btn {
            padding: 0.4rem 1rem;
            border: 2px solid #e94560;
            background: transparent;
            color: #e94560;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #e94560;
            color: #fff;
        }
        #pick-btn {
            padding: 1rem 3rem;
            font-size: 1.4rem;
            border: none;
            border-radius: 12px;
            background: #e94560;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        #pick-btn:hover { transform: scale(1.05); }
        #pick-btn:active { transform: scale(0.97); }
        #result {
            margin-top: 2rem;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            width: 100%;
            animation: popIn 0.35s ease;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .card h2 { font-size: 1.6rem; margin-bottom: 0.4rem; color: #e94560; }
        .card .cuisine { font-size: 1rem; color: #ccc; margin-bottom: 0.3rem; }
        .card .location { font-size: 0.9rem; color: #999; margin-bottom: 0.6rem; }
        .card .price { font-size: 1rem; }
        .card a {
            display: inline-block;
            margin-top: 0.8rem;
            color: #e94560;
            text-decoration: none;
            border-bottom: 1px solid #e94560;
        }
        .spin .card { animation: none; }
        @keyframes slotSpin {
            0% { opacity: 0; transform: translateY(-20px); }
            50% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
        .spinning-name {
            animation: slotSpin 0.15s linear;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Where should we eat?</h1>
    <p class="subtitle">Waterloo &amp; Cedar Falls, Iowa</p>
    <p class="source-note">Top picks from Cedar Valley foodies &amp; local favorites</p>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="american">American</button>
        <button class="filter-btn" data-filter="mexican">Mexican</button>
        <button class="filter-btn" data-filter="asian">Asian</button>
        <button class="filter-btn" data-filter="italian">Italian</button>
        <button class="filter-btn" data-filter="bbq">BBQ / Smokehouse</button>
        <button class="filter-btn" data-filter="breakfast">Breakfast / Brunch</button>
        <button class="filter-btn" data-filter="pizza">Pizza</button>
        <button class="filter-btn" data-filter="burger">Burgers</button>
    </div>

    <button id="pick-btn">Pick a Restaurant!</button>

    <div id="result"></div>
</div>

<script>
// Top 20 Cedar Valley foodie favorites — sourced from the Waterloo-Cedar Falls
// Area Foodies group, KHAK, Little Village, Wanderlog, and local review sites.
const restaurants = [
    // American / Fine Dining / Gastropub
    { name: "The Brown Bottle", cuisine: "Italian-American (since 1972)", category: "italian", location: "Cedar Falls", price: "$$", map: "The+Brown+Bottle+1111+Center+St+Cedar+Falls+IA" },
    { name: "Galleria de Paco", cuisine: "European-American Fine Dining", category: "american", location: "Waterloo", price: "$$$", map: "Galleria+de+Paco+622+Commercial+St+Waterloo+IA" },
    { name: "Montage", cuisine: "American / Creative", category: "american", location: "Cedar Falls", price: "$$", map: "Montage+Cedar+Falls+IA" },
    { name: "SingleSpeed Brewing Co", cuisine: "Brewpub / American", category: "american", location: "Waterloo", price: "$$", map: "SingleSpeed+Brewing+325+Commercial+St+Waterloo+IA" },
    { name: "Whiskey Road Tavern & Grill", cuisine: "American / Bar & Grill", category: "american", location: "Cedar Falls", price: "$$", map: "Whiskey+Road+Tavern+Grill+Cedar+Falls+IA" },
    { name: "George's Local", cuisine: "American / Farm-to-Table", category: "american", location: "Cedar Falls", price: "$$", map: "Georges+Local+Cedar+Falls+IA" },
    { name: "1850 Patio & Grill", cuisine: "American / Grilled", category: "american", location: "Waterloo", price: "$$", map: "1850+Patio+Grill+Waterloo+IA" },
    { name: "Iowa PrimeHouse", cuisine: "Steakhouse / Local", category: "american", location: "Waterloo", price: "$$$", map: "Iowa+PrimeHouse+Waterloo+IA" },
    { name: "Rodney's Kitchen", cuisine: "American Comfort Food", category: "american", location: "Waterloo", price: "$$", map: "Rodneys+Kitchen+Waterloo+IA" },

    // Burgers
    { name: "King Bucks", cuisine: "Gourmet Burgers", category: "burger", location: "Cedar Falls", price: "$$", map: "King+Bucks+Cedar+Falls+IA" },
    { name: "Peppers Grill & Sports Bar", cuisine: "Burgers / Bar & Grill", category: "burger", location: "Cedar Falls", price: "$$", map: "Peppers+Grill+Cedar+Falls+IA" },
    { name: "Southtown Restaurant & Bar", cuisine: "Burgers / Tenderloin", category: "burger", location: "Waterloo", price: "$", map: "Southtown+Restaurant+Bar+Waterloo+IA" },
    { name: "Mac's Drive-In", cuisine: "Classic Drive-In / Burgers", category: "burger", location: "Waterloo", price: "$", map: "Macs+Drive+In+Waterloo+IA" },

    // BBQ / Smokehouse
    { name: "Starbeck's Smokehouse", cuisine: "BBQ / Smoked Meats", category: "bbq", location: "Waterloo", price: "$$", map: "Starbecks+Smokehouse+Waterloo+IA" },

    // Mexican
    { name: "Three Amigos Family Restaurant", cuisine: "Authentic Mexican", category: "mexican", location: "Waterloo", price: "$", map: "Three+Amigos+Family+Restaurant+Waterloo+IA" },
    { name: "Los Cabos Mexican Grill", cuisine: "Mexican", category: "mexican", location: "Cedar Falls", price: "$$", map: "Los+Cabos+Mexican+Grill+Cedar+Falls+IA" },
    { name: "Rudy's Tacos", cuisine: "Tex-Mex", category: "mexican", location: "Waterloo", price: "$", map: "Rudys+Tacos+Waterloo+IA" },

    // Asian
    { name: "Thai Bistro", cuisine: "Thai", category: "asian", location: "Cedar Falls", price: "$$", map: "Thai+Bistro+Cedar+Falls+IA" },
    { name: "Annie's Vietnamese Sandwiches", cuisine: "Vietnamese / Banh Mi", category: "asian", location: "Waterloo", price: "$", map: "Annies+Vietnamese+Sandwiches+Waterloo+IA" },

    // Italian / Pizza
    { name: "Brown Bottle Waterloo", cuisine: "Italian", category: "italian", location: "Waterloo", price: "$$", map: "Brown+Bottle+Waterloo+IA" },
    { name: "Basal Pizza", cuisine: "Artisan Pizza", category: "pizza", location: "Waterloo", price: "$$", map: "Basal+Pizza+Waterloo+IA" },
    { name: "Tony's La Pizzeria", cuisine: "Pizza / Italian", category: "pizza", location: "Waterloo", price: "$$", map: "Tonys+La+Pizzeria+Waterloo+IA" },

    // Breakfast / Brunch
    { name: "Morg's", cuisine: "Classic Diner / Breakfast", category: "breakfast", location: "Waterloo", price: "$", map: "Morgs+Waterloo+IA" },
    { name: "Newton's Paradise Cafe", cuisine: "Breakfast / Brunch", category: "breakfast", location: "Waterloo", price: "$", map: "Newtons+Paradise+Cafe+Waterloo+IA" },
    { name: "J's Homestyle Cooking (Mama J's)", cuisine: "Breakfast / Comfort Food", category: "breakfast", location: "Waterloo", price: "$", map: "Js+Homestyle+Cooking+Waterloo+IA" },
    { name: "Highway 63 Diner", cuisine: "Classic Diner / Breakfast", category: "breakfast", location: "Waterloo", price: "$", map: "Highway+63+Diner+Waterloo+IA" },
    { name: "Oh My Grill", cuisine: "Brunch / American", category: "breakfast", location: "Cedar Falls", price: "$$", map: "Oh+My+Grill+Cedar+Falls+IA" },
    { name: "Patton Diner", cuisine: "Diner / Breakfast", category: "breakfast", location: "Cedar Falls", price: "$", map: "Patton+Diner+Cedar+Falls+IA" },
    { name: "The Horny Toad American Bar & Grill", cuisine: "American / Bar & Grill", category: "american", location: "Cedar Falls", price: "$$", map: "Horny+Toad+American+Bar+Grill+Cedar+Falls+IA" },
];

let activeFilter = "all";

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
    });
});

function getFiltered() {
    if (activeFilter === "all") return restaurants;
    return restaurants.filter(r => r.category === activeFilter);
}

function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function renderCard(r) {
    return `<div class="card">
        <h2>${r.name}</h2>
        <div class="cuisine">${r.cuisine}</div>
        <div class="location">${r.location}</div>
        <div class="price">${r.price}</div>
        <a href="https://www.google.com/maps/search/${r.map}" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>`;
}

const pickBtn = document.getElementById("pick-btn");
const result = document.getElementById("result");

pickBtn.addEventListener("click", () => {
    const pool = getFiltered();
    if (pool.length === 0) {
        result.innerHTML = `<div class="card"><h2>No restaurants found</h2></div>`;
        return;
    }

    pickBtn.disabled = true;
    let spins = 0;
    const totalSpins = 12;
    const interval = setInterval(() => {
        const r = pickRandom(pool);
        result.innerHTML = `<div class="card"><h2 class="spinning-name">${r.name}</h2></div>`;
        spins++;
        if (spins >= totalSpins) {
            clearInterval(interval);
            const winner = pickRandom(pool);
            result.innerHTML = renderCard(winner);
            pickBtn.disabled = false;
        }
    }, 100);
});
</script>
</body>
</html>
