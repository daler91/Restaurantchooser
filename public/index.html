<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Picker - Waterloo / Cedar Falls</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 { font-size: 2rem; margin-bottom: 0.25rem; }
        .subtitle { color: #aaa; margin-bottom: 0.3rem; font-size: 1.1rem; }
        .source-note {
            color: #666; font-size: 0.8rem; margin-bottom: 1.5rem; font-style: italic;
        }
        .filters {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            justify-content: center; margin-bottom: 1.5rem;
        }
        .filter-btn {
            padding: 0.4rem 1rem;
            border: 2px solid #e94560;
            background: transparent;
            color: #e94560;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #e94560; color: #fff;
        }
        #pick-btn {
            padding: 1rem 3rem; font-size: 1.4rem; border: none; border-radius: 12px;
            background: #e94560; color: #fff; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        #pick-btn:hover { transform: scale(1.05); }
        #pick-btn:active { transform: scale(0.97); }
        #pick-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #result {
            margin-top: 2rem; min-height: 200px;
            display: flex; align-items: center; justify-content: center;
            perspective: 800px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px; padding: 1.5rem 2rem; width: 100%;
        }
        .card h2 { font-size: 1.6rem; margin-bottom: 0.4rem; color: #e94560; }
        .card .cuisine { font-size: 1rem; color: #ccc; margin-bottom: 0.3rem; }
        .card .location { font-size: 0.9rem; color: #999; margin-bottom: 0.4rem; }
        .card .rating { font-size: 0.95rem; color: #f5c518; margin-bottom: 0.3rem; }
        .card .price { font-size: 1rem; margin-bottom: 0.3rem; }
        .card .total-ratings { font-size: 0.8rem; color: #777; }
        .card a {
            display: inline-block; margin-top: 0.8rem;
            color: #e94560; text-decoration: none; border-bottom: 1px solid #e94560;
        }

        /* Spin reel */
        .spin-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border-radius: 16px; padding: 2rem; width: 100%;
            overflow: hidden; position: relative;
            border: 2px solid rgba(233, 69, 96, 0.3);
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.15);
        }
        .spin-card .reel-name {
            font-size: 1.8rem; font-weight: bold; color: #fff;
            transition: none;
        }
        .spin-card.slowing .reel-name {
            color: #e94560;
        }

        /* Winner reveal */
        .winner-card {
            animation: winnerReveal 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #e94560;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.4), 0 0 80px rgba(233, 69, 96, 0.15);
        }
        @keyframes winnerReveal {
            0% { opacity: 0; transform: scale(0.3) rotateX(40deg); }
            50% { opacity: 1; transform: scale(1.08) rotateX(-5deg); }
            70% { transform: scale(0.96) rotateX(2deg); }
            100% { transform: scale(1) rotateX(0deg); }
        }
        .winner-card h2 {
            animation: glowPulse 1.5s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px rgba(233, 69, 96, 0.5); }
            50% { text-shadow: 0 0 25px rgba(233, 69, 96, 0.9), 0 0 50px rgba(233, 69, 96, 0.4); }
        }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999;
        }

        /* Button pulse while spinning */
        #pick-btn.spinning {
            animation: btnPulse 0.5s ease-in-out infinite alternate;
            background: linear-gradient(135deg, #e94560, #c62a45);
        }
        @keyframes btnPulse {
            0% { box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4); }
            100% { box-shadow: 0 4px 35px rgba(233, 69, 96, 0.8); }
        }

        .restaurant-count {
            font-size: 0.8rem; color: #555; margin-bottom: 1rem;
        }
    </style>
</head>

function useFallback() {
    restaurants = [...FALLBACK_RESTAURANTS];
    sourceNote.textContent = "Top picks from Cedar Valley foodies";
    pickBtn.disabled = false;
    pickBtn.textContent = "Pick a Restaurant!";
    updateCount();
}

// Check server for API key; use fallback if not available
async function init() {
    try {
        const res = await fetch("/api/config");
        const data = await res.json();
        if (data.apiKey) {
            window._gplacesKey = data.apiKey;
            await loadRestaurants();
        } else {
            useFallback();
        }
    } catch {
        useFallback();
    }
}

init();

// Filter buttons
document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        updateCount();
    });
});

function getFiltered() {
    if (activeFilter === "all") return restaurants;
    return restaurants.filter(r =>
        r.types.some(t => t.toLowerCase().includes(activeFilter)) ||
        r.cuisine.toLowerCase().includes(activeFilter)
    );
}

function updateCount() {
    const pool = getFiltered();
    countEl.textContent = `${pool.length} restaurants loaded`;
}

function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function starsFor(rating) {
    const full = Math.floor(rating);
    const half = rating - full >= 0.25 ? 1 : 0;
    return "★".repeat(full) + (half ? "½" : "") + " " + rating.toFixed(1);
}

function renderCard(r) {
    const mapsUrl = r.placeId
        ? `https://www.google.com/maps/place/?q=place_id:${r.placeId}`
        : `https://www.google.com/maps/search/${r.map}`;
    return `<div class="card">
        <h2>${r.name}</h2>
        <div class="cuisine">${r.cuisine}</div>
        <div class="location">${r.address}</div>
        <div class="rating">${starsFor(r.rating)}</div>
        <div class="price">${r.price}</div>
        <div class="total-ratings">${r.totalRatings} reviews</div>
        <a href="${mapsUrl}" target="_blank" rel="noopener">Open in Google Maps</a>
    </div>`;
}

async function fetchPlaces(query) {
    return new Promise((resolve) => {
        const service = new google.maps.places.PlacesService(document.createElement("div"));
        const request = {
            query: query,
            type: "restaurant",
        };
        service.textSearch(request, (results, status) => {
            if (status === google.maps.places.PlacesServiceStatus.OK) {
                resolve(results);
            } else {
                resolve([]);
            }
        });
    });
}

async function loadRestaurants() {
    sourceNote.textContent = "Loading live restaurant data...";
    pickBtn.disabled = true;
    pickBtn.textContent = "Loading...";
    restaurants = [];

    // Dynamically load Google Maps JS API with Places library
    if (!window.google || !window.google.maps) {
        try {
            await loadGoogleMapsScript();
        } catch (err) {
            useFallback();
            return;
        }
    }

    const seen = new Set();

    for (const query of SEARCH_QUERIES) {
        try {
            const results = await fetchPlaces(query);
            for (const place of results) {
                if (seen.has(place.place_id)) continue;
                seen.add(place.place_id);

                const types = place.types || [];
                const cuisineTypes = types
                    .filter(t => !["point_of_interest", "establishment", "food"].includes(t))
                    .map(t => t.replace(/_/g, " "))
                    .slice(0, 3);

                restaurants.push({
                    name: place.name,
                    cuisine: cuisineTypes.join(", ") || "Restaurant",
                    types: types,
                    address: place.formatted_address || "",
                    rating: place.rating || 0,
                    totalRatings: place.user_ratings_total || 0,
                    price: PRICE_MAP[place.price_level] || "$$",
                    placeId: place.place_id,
                });
            }
        } catch (err) {
            console.warn("Query failed:", query, err);
        }
    }

    // Sort by rating (weighted by number of reviews)
    restaurants.sort((a, b) => {
        const scoreA = a.rating * Math.log10(Math.max(a.totalRatings, 1));
        const scoreB = b.rating * Math.log10(Math.max(b.totalRatings, 1));
        return scoreB - scoreA;
    });

    // Keep top 20
    restaurants = restaurants.slice(0, 20);

    if (restaurants.length > 0) {
        sourceNote.textContent = "Live data from Google Places";
        pickBtn.disabled = false;
        pickBtn.textContent = "Pick a Restaurant!";
        updateCount();
    } else {
        useFallback();
    }
}

function loadGoogleMapsScript() {
    return new Promise((resolve, reject) => {
        if (window.google && window.google.maps && window.google.maps.places) {
            resolve();
            return;
        }
        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${window._gplacesKey}&libraries=places`;
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Failed to load Google Maps script"));
        document.head.appendChild(script);
    });
}

// ── Confetti system ──
function launchConfetti() {
    const canvas = document.createElement("canvas");
    canvas.id = "confetti-canvas";
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ["#e94560", "#f5c518", "#00d2ff", "#ff6b6b", "#48dbfb", "#ff9ff3", "#feca57"];
    const particles = [];

    for (let i = 0; i < 120; i++) {
        particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 200,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 18,
            vy: Math.random() * -18 - 4,
            size: Math.random() * 8 + 3,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 15,
            gravity: 0.3 + Math.random() * 0.2,
            life: 1,
            decay: 0.008 + Math.random() * 0.008,
            shape: Math.random() > 0.5 ? "rect" : "circle",
        });
    }

    function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of particles) {
            if (p.life <= 0) continue;
            alive = true;
            p.x += p.vx;
            p.vy += p.gravity;
            p.y += p.vy;
            p.vx *= 0.98;
            p.rotation += p.rotSpeed;
            p.life -= p.decay;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            if (p.shape === "rect") {
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        if (alive) requestAnimationFrame(drawFrame);
        else canvas.remove();
    }
    requestAnimationFrame(drawFrame);
}

// ── Picker animation ──
pickBtn.addEventListener("click", () => {
    const pool = getFiltered();
    if (pool.length === 0) {
        result.innerHTML = `<div class="card"><h2>No restaurants match this filter</h2></div>`;
        return;
    }

    pickBtn.disabled = true;
    pickBtn.classList.add("spinning");

    const winner = pickRandom(pool);

    // Phase 1: Fast spin (names flying by)
    // Phase 2: Decelerate (slowing down)
    // Phase 3: Lock on winner with reveal

    const totalTicks = 30;
    let tick = 0;

    // Show the reel container
    result.innerHTML = `<div class="spin-card"><div class="reel-name">&nbsp;</div></div>`;
    const spinCard = result.querySelector(".spin-card");
    const reelName = result.querySelector(".reel-name");

    function easeOutExpo(t) {
        return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

    function runTick() {
        tick++;
        const progress = tick / totalTicks;

        // Interval gets longer as we slow down: 40ms → 300ms
        const delay = 40 + easeOutExpo(progress) * 260;

        if (tick < totalTicks - 3) {
            // Fast/medium spin — random names
            const r = pickRandom(pool);
            reelName.textContent = r.name;
            reelName.style.transform = `translateY(0)`;
            reelName.style.opacity = 1;

            // Blur effect during fast spin
            const blur = Math.max(0, 3 - progress * 4);
            reelName.style.filter = `blur(${blur}px)`;
        } else if (tick < totalTicks) {
            // Last 3 ticks — slowing, teasing near-winner names
            spinCard.classList.add("slowing");
            reelName.style.filter = "blur(0)";
            // Show nearby restaurants (not the winner yet)
            const nearMiss = pool.filter(r => r !== winner);
            const r = nearMiss.length > 0 ? pickRandom(nearMiss) : pickRandom(pool);
            reelName.textContent = r.name;
        }

        if (tick < totalTicks) {
            setTimeout(runTick, delay);
        } else {
            // Final reveal!
            setTimeout(() => {
                pickBtn.classList.remove("spinning");
                const mapsUrl = winner.placeId
                    ? `https://www.google.com/maps/place/?q=place_id:${winner.placeId}`
                    : `https://www.google.com/maps/search/${winner.map}`;
                result.innerHTML = `<div class="card winner-card">
                    <h2>${winner.name}</h2>
                    <div class="cuisine">${winner.cuisine}</div>
                    <div class="location">${winner.address}</div>
                    <div class="rating">${starsFor(winner.rating)}</div>
                    <div class="price">${winner.price}</div>
                    <div class="total-ratings">${winner.totalRatings} reviews</div>
                    <a href="${mapsUrl}" target="_blank" rel="noopener">Open in Google Maps</a>
                </div>`;
                launchConfetti();
                pickBtn.disabled = false;
            }, 400);
        }
    }

    runTick();
});
</script>
